name: Reproduce Aperio slide opening on macOS

on:
  push:
    branches: [codex/fix-macos-svs]

permissions:
  contents: read
  actions: read

jobs:
  open-svs:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v8
        with:
          name: dmg-${{ matrix.arch }}
          path: ${{ runner.temp }}/installer
          run-id: 45882330820
          github-token: ${{ github.token }}
      - name: Download the public OpenSlide Aperio sample and open it from the DMG
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          work="$RUNNER_TEMP/svs-repro"
          mkdir -p "$work/mount"
          curl --fail --location --retry 2 --max-time 35 \
            https://huggingface.co/datasets/RendeiroLab/LazySlide-data/resolve/main/sample.svs -o "$work/sample.svs"
          (cd "$work" && printf '%s  sample.svs\n' ed92d5a9f2e86df67640d6f92ce3e231419ce127131697fbbce42ad5e002c8a7 | shasum -a 256 -c)
          mkdir -p "$HOME/Library/Application Support/BioGTK"
          printf 'ImageJPath=\n' > "$HOME/Library/Application Support/BioGTK/Settings.txt"
          python3 -m venv "$work/python"
          "$work/python/bin/python" -m pip install numpy tifffile
          (cd "$RUNNER_TEMP/installer" && shasum -a 256 -c "BioGTK-macos-$ARCH.dmg.sha256")
          hdiutil attach "$RUNNER_TEMP/installer/BioGTK-macos-$ARCH.dmg" -mountpoint "$work/mount" -nobrowse -readonly
          trap 'hdiutil detach "$work/mount"' EXIT
          "$work/python/bin/python" .github/verification/macos/open-images/verify.py "$work/mount/BioGTK.app" "$work/sample.svs"
