name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload (empty builds the selected ref)
        required: false
        type: string
  release:
    types: [published]
  push:
    branches: [main]

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  build:
    name: Build macOS DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x64
            runner: macos-26-intel
    steps:
      - name: Check out packaging scripts
        uses: actions/checkout@v7
        with:
          path: packaging
          sparse-checkout: |
            Source/packaging
            .github/verification/macos
          persist-credentials: false

      - name: Check out BioGTK
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG || github.sha }}
          path: BioGTK/BioGTK
          persist-credentials: false

      - name: Use current packaging scripts with the release source
        run: cp packaging/Source/packaging/* BioGTK/BioGTK/Source/packaging/

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Apple Silicon GTK 3
        if: matrix.arch == 'arm64'
        run: brew install gtk+3

      - name: Install Intel GTK 3
        if: matrix.arch == 'x64'
        env:
          MAMBA_ROOT_PREFIX: ${{ runner.temp }}/micromamba
        run: |
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          brew install micromamba
          # GTK 3.24.52 introduced Quartz dialog focus regressions.
          micromamba create --yes --platform osx-64 --prefix "$RUNNER_TEMP/gtk-x64" \
            --override-channels --channel conda-forge "gtk3=3.24.51" adwaita-icon-theme

      - name: Build macOS DMG
        working-directory: BioGTK/BioGTK
        env:
          BIOGTK_ARCH: ${{ matrix.arch }}
          BioGTKUsePublicPackages: 'true'
        run: |
          BIOGTK_VERSION="$(dotnet msbuild BioGTK.csproj -nologo -getProperty:Version)"
          export BIOGTK_VERSION
          printf 'BIOGTK_VERSION=%s\n' "$BIOGTK_VERSION" >> "$GITHUB_ENV"
          gtk_args=()
          if [[ "$BIOGTK_ARCH" == x64 ]]; then
            gtk_args=(--gtk-prefix "$RUNNER_TEMP/gtk-x64")
          fi
          python3 Source/packaging/build-macos-dmg.py \
            --app-project .github/macos/BioGTKApp.csproj \
            --arch "$BIOGTK_ARCH" "${gtk_args[@]}" \
            --output "$RUNNER_TEMP/BioGTK-macos-$BIOGTK_ARCH.dmg"

      - name: Verify and launch the packaged app
        working-directory: BioGTK/BioGTK
        env:
          BIOGTK_ARCH: ${{ matrix.arch }}
        run: |
          dmg="$RUNNER_TEMP/BioGTK-macos-$BIOGTK_ARCH.dmg"
          python3 -m venv "$RUNNER_TEMP/verify-python"
          "$RUNNER_TEMP/verify-python/bin/python" -m pip install numpy tifffile
          "$RUNNER_TEMP/verify-python/bin/python" "$GITHUB_WORKSPACE/packaging/.github/verification/macos/verify.py" "$dmg" "$BIOGTK_ARCH" "$BIOGTK_VERSION"
          (cd "$RUNNER_TEMP" && shasum -a 256 "$(basename "$dmg")" > "$(basename "$dmg").sha256")

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: dmg-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/BioGTK-macos-${{ matrix.arch }}.dmg
            ${{ runner.temp }}/BioGTK-macos-${{ matrix.arch }}.dmg.sha256
          compression-level: 0
          if-no-files-found: error

  release:
    if: inputs.tag != '' || github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dmg-*
          merge-multiple: true
      - name: Attach both DMGs to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shasum -a 256 -c BioGTK-macos-arm64.dmg.sha256
          shasum -a 256 -c BioGTK-macos-x64.dmg.sha256
          gh release upload "$RELEASE_TAG" BioGTK-macos-arm64.dmg BioGTK-macos-x64.dmg --repo "$GITHUB_REPOSITORY" --clobber
