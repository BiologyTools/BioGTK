name: Reproduce macOS file opening

on:
  push:
    branches: [codex/fix-macos-image-opening]
    paths:
      - .github/workflows/probe-macos-image-opening.yml

permissions:
  actions: read
  contents: read

jobs:
  open-images:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/verification/macos/open-images
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v8
        with:
          name: dmg-${{ matrix.arch }}
          run-id: 45850429169
          github-token: ${{ github.token }}
          path: installer
      - name: Test image opening from the published bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/file-open-probe"
          mkdir -p "$work/mount"
          python3 -m venv "$work/python"
          "$work/python/bin/python" -m pip -q install numpy tifffile
          (cd installer && shasum -a 256 -c "BioGTK-macos-$ARCH.dmg.sha256")
          hdiutil attach "installer/BioGTK-macos-$ARCH.dmg" -mountpoint "$work/mount" -nobrowse -readonly
          trap 'hdiutil detach "$work/mount"' EXIT
          "$work/python/bin/python" .github/verification/macos/open-images/verify.py "$work/mount/BioGTK.app"
